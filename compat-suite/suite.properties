# Lecithin plugin compatibility suite - which servers to run and how to get them.
# See README.md. Every jar download is pinned by sha256.

suite.minecraft=26.2
# runner/src/main/resources/protocol/<suite.protocol>.properties - packet ids of the headless client
suite.protocol=26.2
suite.reference=paper
suite.targets=paper,lecithin
suite.javaOpts=-Xms1G -Xmx2G

# Reference: Paper 26.2 build 118, the Paper commit (5d4f9bd) Folia and therefore Lecithin are based on
# at lophineRef fb4cc7e. Re-pin when the upstream Paper ref moves.
target.paper.label=Paper 26.2 build 118 (reference)
target.paper.jar=paper:26.2:118:1fdb86222a567800f4f4b61104ff565284f9f5c891190fec20a80d41eb985108
target.paper.port=25720

# Candidate: the CI pre-release of dev/26.2 at 70856ea. To test a local build instead:
#   ./gradlew -p compat-suite runSuite -Pcompat.lecithinJar=../lecithin-server/build/libs/lecithin-paperclip-26.2.local-SNAPSHOT.jar
target.lecithin.label=Lecithin 26.2 (dev/26.2 70856ea, CI pre-release)
target.lecithin.jar=github-release:LophineLabs/Lecithin:26.2-70856ea:lecithin-26.2-paperclip.jar:fadb38f62f61b3592378edcbbade41e52c5454e3c7ce9ce4bd281b42c6733e70
target.lecithin.port=25722

# The same Lecithin jar with the legacy-scheduler compatibility layer switched off by config, i.e. stock
# Folia behaviour for exactly the paths the suite exercises: shows what the compat features change.
# Run with -Pcompat.targets=paper,lecithin,lecithin-dispatch-off
target.lecithin-dispatch-off.label=Lecithin 26.2 with compat-config.caller-context-dispatch=false
target.lecithin-dispatch-off.jar=@lecithin
target.lecithin-dispatch-off.port=25724
target.lecithin-dispatch-off.file.lecithin_config/lecithin_global_config.toml=[compat-config]\ncaller-context-dispatch = false\n
